[project]
name = "rag-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rag-core",
    "fastapi>=0.115,<1",
    "uvicorn>=0.35,<1",
    "python-multipart>=0.0.20,<1",
]

[tool.uv.sources]
rag-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
