<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1510" viewBox="0 0 1600 1510" role="img" aria-labelledby="title desc">
<title id="title">RAG Observatory project workflow</title><desc id="desc">Technical documents become a published corpus. Corpus versions feed index building and source-reviewed evaluation datasets. Both bind an immutable experiment manifest. A durable worker retrieves passages, packs context and generates answers. Saved traces and metrics feed paired comparisons and checked evidence exports. Next.js calls FastAPI; PostgreSQL and persistent artifact and model volumes support the API and worker.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a43b24"/></marker></defs>
<rect width="1600" height="1510" fill="#eeeee7"/>
<style>text{fill:#292e27;font-family:Arial,sans-serif}.title{font-family:Georgia,serif;font-size:53px}.sub{font-size:24px;fill:#585e54}.head{font-family:Georgia,serif;font-size:31px}.body{font-size:21px;fill:#444c40}.label{font-size:19px;font-weight:bold;letter-spacing:1.2px;fill:#a43b24}.arrow{fill:none;stroke:#a43b24;stroke-width:2.5;marker-end:url(#arrow)}.box{fill:#f8f8f2;stroke:#b8bcb0;stroke-width:1.5}.runtime{font-size:22px}.tiny{font-size:19px;fill:#585e54}</style>
<text x="60" y="77" class="title">RAG Observatory</text><text x="60" y="118" class="sub">From technical documents to evidence-backed RAG comparisons</text>

<rect class="box" x="180" y="170" width="490" height="150" rx="3"/>
<text class="head" x="206" y="204">Upload technical documents</text>
<text class="body" x="206" y="242">PDF · HTML · Markdown · plain text</text>
<text class="body" x="206" y="272">Validated uploads; originals retained</text>
<rect class="box" x="890" y="170" width="530" height="150" rx="3"/>
<text class="head" x="916" y="204">Extract &amp; publish a corpus</text>
<text class="body" x="916" y="242">Canonical sections with source locations</text>
<text class="body" x="916" y="272">Immutable, versioned source snapshots</text>
<path class="arrow" d="M670 245H890"/>
<rect class="box" x="180" y="385" width="600" height="185" rx="3"/>
<text class="label" x="206" y="419">RETRIEVAL PREPARATION</text>
<text class="head" x="206" y="462">Build an index variant</text>
<text class="body" x="206" y="500">Fixed-token or section-aware chunking</text>
<text class="body" x="206" y="530">Lexical / dense indexes; pinned local embeddings</text>
<rect class="box" x="880" y="385" width="600" height="185" rx="3"/>
<text class="label" x="906" y="419">DATASET PREPARATION</text>
<text class="head" x="906" y="462">Curate evaluation questions</text>
<text class="body" x="906" y="500">Reference answers, canonical gold evidence</text>
<text class="body" x="906" y="530">Review provenance; grouped development / test splits</text>
<path class="arrow" d="M1155 320V350H480V385"/>
<path class="arrow" d="M1155 350H1180V385"/>
<rect class="box" x="480" y="635" width="690" height="155" rx="3"/>
<text class="head" x="506" y="669">Freeze the experiment manifest</text>
<text class="body" x="506" y="707">Corpus + dataset + index + retrieval configuration</text>
<text class="body" x="506" y="737">Model, prompt, seed, code / lock / runtime identity</text>
<path class="arrow" d="M480 570V600H650V635"/>
<path class="arrow" d="M1180 570V600H1000V635"/>
<rect class="box" x="60" y="855" width="460" height="165" rx="3"/>
<text class="label" x="86" y="889">DURABLE WORKER</text>
<text class="head" x="86" y="932">Retrieve evidence</text>
<text class="body" x="86" y="970">Lexical · dense · hybrid RRF</text>
<text class="body" x="86" y="1000">Optional local cross-encoder reranking</text>
<rect class="box" x="570" y="855" width="460" height="165" rx="3"/>
<text class="head" x="596" y="889">Pack the context</text>
<text class="body" x="596" y="927">Apply the token budget</text>
<text class="body" x="596" y="957">Trace clipped and omitted passages</text>
<rect class="box" x="1080" y="855" width="460" height="165" rx="3"/>
<text class="head" x="1106" y="889">Generate an answer</text>
<text class="body" x="1106" y="927">Pinned local CPU model</text>
<text class="body" x="1106" y="957">Save results, attempts and checkpoints</text>
<path class="arrow" d="M825 790V820H290V855"/>
<path class="arrow" d="M520 940H570"/>
<path class="arrow" d="M1030 940H1080"/>
<rect class="box" x="60" y="1085" width="460" height="180" rx="3"/>
<text class="head" x="86" y="1119">Inspect traces &amp; metrics</text>
<text class="body" x="86" y="1157">Retrieval / context coverage; latency</text>
<text class="body" x="86" y="1187">Optional answer assessments, separately</text>
<text class="body" x="86" y="1217">Missing quality scores stay unavailable</text>
<rect class="box" x="570" y="1085" width="460" height="180" rx="3"/>
<text class="head" x="596" y="1119">Compare experiments</text>
<text class="body" x="596" y="1157">Paired results; grouped bootstrap</text>
<text class="body" x="596" y="1187">Coverage counts and control checks</text>
<text class="body" x="596" y="1217">Failure explorer and source inspection</text>
<rect class="box" x="1080" y="1085" width="460" height="180" rx="3"/>
<text class="head" x="1106" y="1119">Export &amp; hand off</text>
<text class="body" x="1106" y="1157">Checksummed evidence ZIPs</text>
<text class="body" x="1106" y="1187">Reports with limitations and lineage</text>
<text class="body" x="1106" y="1217">Private backup / isolated restore checks</text>
<path class="arrow" d="M1310 1020V1050H290V1085"/>
<path class="arrow" d="M520 1175H570"/>
<path class="arrow" d="M1030 1175H1080"/>
<line x1="60" y1="1320" x2="1540" y2="1320" stroke="#b8bcb0"/>
<text x="60" y="1360" class="label">RUNTIME STRUCTURE</text>
<text x="60" y="1402" class="runtime">Next.js workspace → FastAPI → PostgreSQL / pgvector ← Durable Python worker</text>
<text x="60" y="1440" class="tiny">Persistent volumes: originals, evidence exports, and model artifacts. Heavy inference runs in the worker.</text>
<text x="60" y="1477" class="tiny">Workflow describes implemented capabilities; it does not claim completed benchmarks or validated answer quality.</text>
</svg>